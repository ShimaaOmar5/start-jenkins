
services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - floci_data:/app/data
    networks:
      - devops

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - devops
    depends_on:
      - floci

volumes:
  floci_data:
  jenkins_home:

networks:
  devops:
    driver: bridge
